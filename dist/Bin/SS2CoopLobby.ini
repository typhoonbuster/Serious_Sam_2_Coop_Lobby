; SS2CoopLobby - configuration (read when the game starts)
; Every player needs the mod. The lobby settings (PreLobby, LobbyTimeout, PauseDuringLobby,
; WaitOnLevelChange, LoadTimeout, IntroTimeout, KeyStart) are the host's; the others apply to
; each player's own game.

[Lobby]
; 1 = mod enabled, 0 = original game
Enabled=1

; Lobby BEFORE loading: the level only loads once the session is full
; (max players reached, host included). With 1 max player, it loads at once.
PreLobby=1
; Longest wait (s) in that lobby before loading anyway (0 = wait forever)
LobbyTimeout=0

; Freeze the world (server pause) until everybody has entered the map
PauseDuringLobby=1

; On level changes: wait until everybody has loaded (and finished the OUTRO),
; then play the next level's INTRO for everybody
WaitOnLevelChange=1
; Longest wait (s) for players still loading (0 = forever)
LoadTimeout=120
; Longest wait (s) for everybody to finish the cinematic (0 = forever)
IntroTimeout=300

; Coop cinematics: EPISODE + INTRO at the start of a level, OUTRO at its end
PlayIntro=1
PlayOutro=1

; Show the lobby panel
Overlay=1
; Panel language: auto (the system's language), en, fr, es, de or ru
Language=auto

; Host key to start without waiting (Windows virtual-key code, decimal): 119 = F8
KeyStart=119

; Join a game from a Steam invitation (the base game cannot)
SteamInvites=1

; Detailed log in Bin/SS2CoopLobby.log
Verbose=0
